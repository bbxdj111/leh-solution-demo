<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftService - Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
        .login-card { background: white; border-radius: 1.25rem; box-shadow: 0 20px 40px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        .role-tab { padding: 15px; font-weight: 600; cursor: pointer; text-align: center; background: #f1f5f9; color: #64748b; border-bottom: 3px solid transparent; }
        .role-tab.active { background: white; color: #1e3a8a; border-bottom: 3px solid #1e3a8a; }
        .lang-btn { font-size: 0.8rem; font-weight: 600; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="login-card p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="index.html" class="text-decoration-none fw-bold fs-5 text-dark"><i class="bi bi-arrow-left me-1"></i> Startseite</a>
            <div class="btn-group">
                <button class="btn btn-sm btn-primary lang-btn" id="btn-de" onclick="setLanguage('de')">DE</button>
                <button class="btn btn-sm btn-outline-primary lang-btn" id="btn-ru" onclick="setLanguage('ru')">RU</button>
            </div>
        </div>

        <div class="text-center mb-4">
            <div class="fs-1 text-primary mb-2"><i class="bi bi-shield-lock"></i></div>
            <h4 class="fw-bold" id="login-title">Mitarbeiter Login</h4>
            <p class="text-muted small" id="login-subtitle">Wählen Sie Ihre Rolle aus, um fortzufahren</p>
        </div>

        <div class="row g-0 mb-4 rounded overflow-hidden">
            <div class="col-6 role-tab active" id="tab-admin" onclick="switchRole('admin')">
                <i class="bi bi-headset me-1"></i> Disponent
            </div>
            <div class="col-6 role-tab" id="tab-master" onclick="switchRole('master')">
                <i class="bi bi-hammer me-1"></i> Handwerker
            </div>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-semibold">Benutzername</label>
                <input type="text" id="username" class="form-control" placeholder="z.B. admin" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Passwort</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm" id="btn-login">Anmelden</button>
        </form>
    </div>

    <script>
        let selectedRole = 'admin';
        function switchRole(role) {
            selectedRole = role;
            document.getElementById('tab-admin').className = role === 'admin' ? 'col-6 role-tab active' : 'col-6 role-tab';
            document.getElementById('tab-master').className = role === 'master' ? 'col-6 role-tab active' : 'col-6 role-tab';
        }
        function handleLogin(event) {
            event.preventDefault();
            window.location.href = selectedRole === 'admin' ? 'admin.html' : 'master.html';
        }
        function setLanguage(lang) {
            document.getElementById('btn-de').className = lang === 'de' ? 'btn btn-sm btn-primary lang-btn' : 'btn btn-sm btn-outline-primary lang-btn';
            document.getElementById('btn-ru').className = lang === 'ru' ? 'btn btn-sm btn-primary lang-btn' : 'btn btn-sm btn-outline-primary lang-btn';
        }
    </script>
</body>
</html>
