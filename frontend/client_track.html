<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 350px; width: 100%; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .lang-btn { cursor: pointer; border-radius: 20px; padding: 4px 12px; font-weight: bold; }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 600px;">
        
        <!-- Шапка с языковым тугглом -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0" id="title-text">📍 Anfahrts-Tracking</h4>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-primary btn-sm lang-btn" id="btn-de" onclick="setLanguage('de')">DE</button>
                <button type="button" class="btn btn-outline-primary btn-sm lang-btn" id="btn-ru" onclick="setLanguage('ru')">RU</button>
            </div>
        </div>

        <!-- Карта -->
        <div id="map"></div>

        <!-- Информация о заказе -->
        <div class="status-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0" id="order-title">Lade Auftrag...</h5>
                <span class="badge bg-primary fs-6" id="status-badge">Unterwegs</span>
            </div>
            
            <hr>
            
            <div class="mb-2">
                <small class="text-muted d-block" id="lbl-master">Handwerker:</small>
                <strong class="fs-6" id="master-name">Alex</strong>
            </div>
            
            <div class="mb-2">
                <small class="text-muted d-block" id="lbl-address">Zieladresse:</small>
                <span id="order-address">Berlin, Alexanderplatz 3</span>
            </div>

            <div class="alert alert-success mt-3 mb-0 d-flex align-items-center gap-2">
                <span>🚚</span>
                <span id="eta-text">Der Handwerker ist auf dem Weg zu Ihnen!</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLang = 'de';

        const i18n = {
            de: {
                title: "📍 Anfahrts-Tracking",
                statusOnWay: "Unterwegs",
                master: "Handwerker:",
                address: "Zieladresse:",
                eta: "Der Handwerker ist auf dem Weg zu Ihnen!",
                loading: "Lade Auftrag..."
            },
            ru: {
                title: "📍 Отслеживание мастера",
                statusOnWay: "В пути",
                master: "Мастер:",
                address: "Адрес назначения:",
                eta: "Мастер уже едет к вам!",
                loading: "Загрузка заказа..."
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            
            // Подсветка кнопок
            document.getElementById('btn-de').className = lang === 'de' ? 'btn btn-primary btn-sm lang-btn' : 'btn btn-outline-primary btn-sm lang-btn';
            document.getElementById('btn-ru').className = lang === 'ru' ? 'btn btn-primary btn-sm lang-btn' : 'btn btn-outline-primary btn-sm lang-btn';
            
            // Перевод текстов
            const t = i18n[lang];
            document.getElementById('title-text').textContent = t.title;
            document.getElementById('status-badge').textContent = t.statusOnWay;
            document.getElementById('lbl-master').textContent = t.master;
            document.getElementById('lbl-address').textContent = t.address;
            document.getElementById('eta-text').textContent = t.eta;
        }

        // Инициализация карты (Берлин)
        const map = L.map('map').setView([52.5200, 13.4050], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Маркеры мастера и назначения
        const masterMarker = L.marker([52.5180, 13.4000]).addTo(map).bindPopup('Handwerker / Мастер');
        const destMarker = L.marker([52.5219, 13.4132]).addTo(map).bindPopup('Ziel / Клиент');

        // Получение order_id из URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id') || 1;

        async function loadOrderDetails() {
            try {
                const res = await fetch(`/orders/${orderId}`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('order-title').textContent = `#${data.id} ${data.title}`;
                    document.getElementById('order-address').textContent = data.address;
                }
            } catch (e) {
                console.error(e);
            }
        }

        loadOrderDetails();
    </script>
</body>
</html>
