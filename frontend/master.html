<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Copilot — Рабочее место мастера</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Верхняя панель -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center sticky top-0 z-10">
        <div>
            <h1 class="font-bold text-lg text-blue-400">FSM Copilot</h1>
            <p class="text-xs text-slate-400">Заказы на сегодня</p>
        </div>
        <span id="network-status" class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20">Онлайн</span>
    </header>

    <!-- Основной контент -->
    <main class="p-4 max-w-md mx-auto space-y-4" id="orders-container">
        
        <!-- Карточка заказа -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg space-y-3">
            <div class="flex justify-between items-start">
                <h2 class="font-semibold text-base text-white">Ремонт кондиционера #1042</h2>
                <span class="bg-amber-500/10 text-amber-400 text-xs px-2 py-0.5 rounded border border-amber-500/20">В работе</span>
            </div>
            
            <p class="text-sm text-slate-300">г. Берлин, ул. Александрплац, 12</p>
            <p class="text-xs text-slate-400">Замена компрессора и заправка фреона.</p>

            <!-- Блок Склада Van Stock (Pro Tier) -->
            <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-700/80 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-blue-300">📦 Запчасти в авто (Van Stock):</span>
                    <span class="text-[10px] bg-blue-500/20 text-blue-300 px-1.5 py-0.5 rounded">Pro Tier</span>
                </div>
                
                <div class="flex gap-2">
                    <select id="part-select" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded p-2 flex-grow focus:outline-none focus:border-blue-500">
                        <option value="">-- Выберите деталь --</option>
                        <option value="item-1">Фреон R410A (Остаток: 5 кг)</option>
                        <option value="item-2">Фильтр тонкой очистки (Остаток: 2 шт)</option>
                    </select>
                    <button onclick="consumeSelectedPart()" class="bg-emerald-600 hover:bg-emerald-500 text-xs text-white px-3 py-2 rounded font-medium">
                        Списать
                    </button>
                </div>
            </div>

            <!-- Фотоотчет До / После -->
            <div class="border-t border-slate-700/50 pt-3">
                <label class="block text-xs text-slate-400 mb-2">Фотоотчёт (До / После):</label>
                <div class="grid grid-cols-2 gap-2">
                    <input type="file" accept="image/*" capture="environment" id="photo-before" class="hidden">
                    <button onclick="document.getElementById('photo-before').click()" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded text-center text-slate-200">
                        📷 Фото "ДО"
                    </button>
                    
                    <input type="file" accept="image/*" capture="environment" id="photo-after" class="hidden">
                    <button onclick="document.getElementById('photo-after').click()" class="bg-slate-700 hover:bg-slate-600 text-xs py-2 px-3 rounded text-center text-slate-200">
                        📸 Фото "ПОСЛЕ"
                    </button>
                </div>
            </div>

            <!-- Действия -->
            <div class="pt-2">
                <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-2.5 rounded-lg transition">
                    Завершить работу
                </button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('PWA Service Worker зарегистрирован'))
                .catch(err => console.error('Ошибка SW:', err));
        }

        function consumeSelectedPart() {
            const select = document.getElementById('part-select');
            if(!select.value) {
                alert('Пожалуйста, выберите деталь для списания');
                return;
            }
            alert('Деталь успешно списана со склада автомобиля!');
        }
    </script>
</body>
</html>
