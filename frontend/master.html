<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwerker-Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .order-card { background: white; border-radius: 12px; border-left: 5px solid #0d6efd; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; padding: 20px; }
        .file-upload-btn { display: inline-block; padding: 8px 16px; background-color: #e9ecef; color: #495057; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .file-upload-btn:hover { background-color: #dee2e6; }
        input[type="file"] { display: none; }
        .lang-btn { cursor: pointer; border-radius: 20px; padding: 4px 12px; font-weight: bold; }
    </style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 600px;">
        <!-- Шапка с переключателем языка -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0" id="title-text">📋 Meine Aufträge</h3>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-primary btn-sm lang-btn" id="btn-de" onclick="setLanguage('de')">DE</button>
                <button type="button" class="btn btn-outline-primary btn-sm lang-btn" id="btn-ru" onclick="setLanguage('ru')">RU</button>
            </div>
        </div>

        <div id="orders-list">
            <div class="text-center text-muted" id="loading-text">Lade Aufträge...</div>
        </div>
    </div>

    <script>
        const MASTER_ID = 1;
        let currentLang = 'de';

        const i18n = {
            de: {
                title: "📋 Meine Aufträge",
                loading: "Lade Aufträge...",
                empty: "Keine zugewiesenen Aufträge gefunden.",
                statusInProgress: "In Bearbeitung",
                client: "Kunde",
                trackingLink: "Kunden-Tracking Link öffnen",
                uploadPhoto: "📷 Foto von Baustelle hochladen:",
                selectFile: "📁 Datei auswählen",
                noFile: "Keine Datei ausgewählt",
                completeOrder: "✅ Auftrag abschließen",
                alertComplete: "Auftrag erfolgreich abgeschlossen!"
            },
            ru: {
                title: "📋 Мои заказы",
                loading: "Загрузка заказов...",
                empty: "Назначенных заказов не найдено.",
                statusInProgress: "В работе",
                client: "Клиент",
                trackingLink: "Открыть ссылку трекинга клиента",
                uploadPhoto: "📷 Загрузить фото с объекта:",
                selectFile: "📁 Выбрать файл",
                noFile: "Файл не выбран",
                completeOrder: "✅ Завершить заказ",
                alertComplete: "Заказ успешно завершён!"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            
            // Подсветка активной кнопки
            document.getElementById('btn-de').className = lang === 'de' ? 'btn btn-primary btn-sm lang-btn' : 'btn btn-outline-primary btn-sm lang-btn';
            document.getElementById('btn-ru').className = lang === 'ru' ? 'btn btn-primary btn-sm lang-btn' : 'btn btn-outline-primary btn-sm lang-btn';
            
            // Обновление заголовка
            document.getElementById('title-text').textContent = i18n[lang].title;

            // Перерисовываем заказы с новым языком
            loadMasterOrders();
        }

        async function loadMasterOrders() {
            try {
                const res = await fetch(`/master/${MASTER_ID}/orders`);
                const orders = await res.json();
                const container = document.getElementById('orders-list');
                const t = i18n[currentLang];
                
                if (orders.length === 0) {
                    container.innerHTML = `<div class="alert alert-info">${t.empty}</div>`;
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="order-card">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="fw-bold mb-0">#${o.id} ${o.title}</h5>
                            <span class="badge bg-warning text-dark">${t.statusInProgress}</span>
                        </div>
                        <p class="mb-1 text-muted">📍 ${o.address}</p>
                        <p class="mb-2 text-muted">👤 ${t.client}: ${o.client_name}</p>
                        <p class="mb-3">
                            🔗 <a href="/frontend/client_track.html?order_id=${o.id}" target="_blank" class="fw-bold text-decoration-none">${t.trackingLink}</a>
                        </p>
                        
                        <div class="bg-light p-3 rounded mb-3">
                            <label class="form-label fw-bold mb-2">${t.uploadPhoto}</label>
                            <div class="d-flex align-items-center gap-2">
                                <label for="file-input-${o.id}" class="file-upload-btn">
                                    ${t.selectFile}
                                </label>
                                <span id="file-name-${o.id}" class="text-muted small">${t.noFile}</span>
                                <input type="file" id="file-input-${o.id}" accept="image/*" onchange="updateFileName(${o.id})">
                            </div>
                        </div>

                        <button class="btn btn-success w-100 fw-bold py-2" onclick="completeOrder(${o.id})">
                            ${t.completeOrder}
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        function updateFileName(orderId) {
            const input = document.getElementById(`file-input-${orderId}`);
            const fileNameSpan = document.getElementById(`file-name-${orderId}`);
            const t = i18n[currentLang];
            if (input.files.length > 0) {
                fileNameSpan.textContent = input.files[0].name;
                fileNameSpan.classList.remove('text-muted');
                fileNameSpan.classList.add('text-success', 'fw-bold');
            } else {
                fileNameSpan.textContent = t.noFile;
                fileNameSpan.classList.add('text-muted');
                fileNameSpan.classList.remove('text-success', 'fw-bold');
            }
        }

        async function completeOrder(orderId) {
            alert(i18n[currentLang].alertComplete);
            loadMasterOrders();
        }

        loadMasterOrders();
    </script>
</body>
</html>
